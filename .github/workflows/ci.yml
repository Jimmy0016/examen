name: CI - build & test & push

on:
  push:
    branches: [ 'espinoza' ]
#vamosss
permissions:
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/jimmy0016/espinoza:1.0.5
          ghcr.io/jimmy0016/espinoza:latest
        labels: |
          org.opencontainers.image.source=https://github.com/Jimmy0016/examen
          org.opencontainers.image.description=Flask AI App - Espinoza CI/CD
          org.opencontainers.image.version=1.0.5
