name: CD - deploy to VPS

on:
  push:
    branches: [ 'espinoza' ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy stack to VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          set -e
          echo "Pulling image..."
          docker pull ghcr.io/${{ github.repository_owner }}/espinoza:1.0.5

          echo "Updating docker stack..."
          cat << 'EOF' > /tmp/docker-stack-espinoza.yml
services:
  app:
    image: ghcr.io/${{ github.repository_owner }}/espinoza:1.0.5
    ports:
      - "8000:8000"
    deploy:
      replicas: 1
EOF

          echo "Deploying stack..."
          docker stack deploy -c /tmp/docker-stack-espinoza.yml espinoza_stack
