name: CD - deploy to VPS

on:
  push:
    branches: [ 'espinoza' ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy stack to VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          set -e
          echo "Logging into GitHub Container Registry..."
          echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "Pulling latest image..."
          docker pull ghcr.io/jimmy0016/espinoza:1.0.5

          echo "Stopping existing containers if any..."
          docker stack rm espinoza_stack || true
          sleep 10

          echo "Creating docker stack configuration..."
          cat << 'EOF' > /tmp/docker-stack-espinoza.yml
version: '3.8'
services:
  microai:
    image: ghcr.io/jimmy0016/espinoza:1.0.5
    ports:
      - "1001:5000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
EOF

          echo "Deploying new stack..."
          docker stack deploy -c /tmp/docker-stack-espinoza.yml espinoza_stack
          
          echo "Waiting for deployment to stabilize..."
          sleep 20
          
          echo "Checking deployment status..."
          docker stack services espinoza_stack
          
          echo "Testing health endpoint..."
          for i in {1..5}; do
            if curl -f http://localhost:1001/health; then
              echo "Health check passed!"
              break
            else
              echo "Health check failed, attempt $i/5"
              sleep 5
            fi
          done
